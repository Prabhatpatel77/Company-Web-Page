<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | NovaCore</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="logo"
                 style="justify-content:center; margin-bottom:20px; color:#07111f;">
                <span>FT</span>
                FINTECH
            </div>
            <h1>Create Account</h1>
            <p>
                Register as an administrator or employee
            </p>
        </div>
        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>
            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >
            </div>
            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                >
            </div>
            <div class="form-group">
                <label>Account Type</label>
                <select id="role" required>
                    <option value="">
                        Select account type
                    </option>
                    <option value="employee">
                        Employee
                    </option>
                    <option value="admin">
                        Administrator
                    </option>
                </select>
            </div>
            <div class="form-group">
                <label>Department</label>
                <input
                    type="text"
                    id="department"
                    placeholder="e.g. IT"
                >
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input
                    type="text"
                    id="phone"
                    placeholder="Phone number"
                >
            </div>
            <button
                type="submit"
                class="form-button">
                Create Account
            </button>
            <p
                id="message"
                class="form-message">
            </p>

        </form>
        <div class="auth-link">
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </div>

    </div>

</div>

<script src="js/register.js"></script>

</body>

</html>
