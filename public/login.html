<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | FINTECH</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="logo"
                 style="justify-content:center; margin-bottom:20px; color:#07111f;">

                <span>FT</span>
                FINTECH

            </div>
            <h1>Welcome Back</h1>
            <p>
                Login to access your company portal
            </p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >
            </div>
            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>
            <button
                type="submit"
                class="form-button">
                Login
            </button>
            <p
                id="message"
                class="form-message">
            </p>

        </form>
        <div class="auth-link">
            Don't have an account?
            <a href="register.html">
                Register
            </a>
        </div>
        <div class="auth-link">
            <a href="index.html">
                ← Back to Home
            </a>
        </div>
    </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
